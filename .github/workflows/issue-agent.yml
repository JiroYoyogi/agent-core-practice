name: Issue Agent

on:
  issues:
    types: [labeled]

permissions:
  id-token: write

jobs:
  inspect-issue:
    if: >-
      github.event.label.name == 'run-agent' &&
      github.actor == 'JiroYoyogi'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Convert issue body to request
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const event = JSON.parse(
            fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8')
          );

          const prompt = event.issue.body;

          if (typeof prompt !== 'string' || !prompt.trim()) {
            throw new Error('Issue本文が空です。');
          }

          console.log('Issue番号:', event.issue.number);
          console.log(JSON.stringify({ prompt }));
          NODE

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Check AWS identity
        run: aws sts get-caller-identity

      - name: Check AgentCore environment
        env:
          AGENT_RUNTIME_ARN: ${{ vars.AGENT_RUNTIME_ARN }}
          AGENT_RUNTIME_ENDPOINT: ${{ vars.AGENT_RUNTIME_ENDPOINT }}
        run: |
          set -euo pipefail

          : "${AGENT_RUNTIME_ARN:?Repository variableが未設定です}"
          : "${AGENT_RUNTIME_ENDPOINT:?Repository variableが未設定です}"

          SESSION_ID=$(node -p "require('node:crypto').randomUUID()")

          aws bedrock-agentcore invoke-agent-runtime \
            --region ap-northeast-1 \
            --agent-runtime-arn "$AGENT_RUNTIME_ARN" \
            --qualifier "$AGENT_RUNTIME_ENDPOINT" \
            --runtime-session-id "$SESSION_ID" \
            --content-type application/json \
            --cli-binary-format raw-in-base64-out \
            --payload '{"action":"check_environment"}' \
            --cli-read-timeout 180 \
            response.json

          cat response.json 