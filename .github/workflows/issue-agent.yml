name: Issue Agent

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  id-token: write

jobs:
  inspect-issue:
    if: >-
      github.actor == 'JiroYoyogi' &&
      !github.event.issue.pull_request &&
      (
        (
          github.event_name == 'issues' &&
          github.event.label.name == 'run-agent'
        ) ||
        (
          github.event_name == 'issue_comment' &&
          startsWith(github.event.comment.body, '/agent ')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Convert task to request
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const event = JSON.parse(
            fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8')
          );

          const isComment = process.env.GITHUB_EVENT_NAME === 'issue_comment';

          const prompt = isComment
            ? event.comment.body.slice('/agent '.length).trim()
            : event.issue.body;

          if (typeof prompt !== 'string' || !prompt.trim()) {
            throw new Error('依頼文が空です。');
          }

          console.log('Issue番号:', event.issue.number);
          console.log(JSON.stringify({ prompt }));

          const payload = JSON.stringify({ prompt });

          if (Buffer.byteLength(payload, 'utf8') > 16 * 1024) {
            throw new Error('リクエストがRuntimeの上限16 KiBを超えています。');
          }

          fs.writeFileSync('request.json', payload, 'utf8');

          NODE

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Check AWS identity
        run: aws sts get-caller-identity

      - name: Invoke AgentCore with issue body
        env:
          AGENT_RUNTIME_ARN: ${{ vars.AGENT_RUNTIME_ARN }}
          AGENT_RUNTIME_ENDPOINT: ${{ vars.AGENT_RUNTIME_ENDPOINT }}
        run: |
          set -euo pipefail

          : "${AGENT_RUNTIME_ARN:?Repository variableが未設定です}"
          : "${AGENT_RUNTIME_ENDPOINT:?Repository variableが未設定です}"

          SESSION_ID=$(node -p "require('node:crypto').randomUUID()")

          aws bedrock-agentcore invoke-agent-runtime \
            --region ap-northeast-1 \
            --agent-runtime-arn "$AGENT_RUNTIME_ARN" \
            --qualifier "$AGENT_RUNTIME_ENDPOINT" \
            --runtime-session-id "$SESSION_ID" \
            --content-type application/json \
            --payload fileb://request.json \
            --cli-read-timeout 180 \
            response.json

          cat response.json 